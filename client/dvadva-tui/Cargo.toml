[package]
name = "dvadva-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dvadva-tui"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
similar.workspace = true
unicode-width = "0.2"

crossterm = "0.29"
ratatui = "0.30"

dvadva-agent = { path = "../../server/dvadva-agent" }
kosong = { path = "../../server/kosong" }
wire-client = { path = "../wire-client" }

# Embeds the .exe's own icon (build.rs). Host-gated: nothing else in the
# tree needs it, and the Linux side of the build should not carry it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
