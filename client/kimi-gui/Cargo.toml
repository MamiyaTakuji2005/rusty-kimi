[package]
name = "kimi-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kimi-gui"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
similar.workspace = true

rfd = "0.15"
eframe = "0.32"
# `load-images` is a default feature, but it only does anything if the app
# calls `egui_extras::install_image_loaders`, which this one never has —
# markdown images do not render either way. Off, it drops egui_extras and
# the image codecs from the build.
egui_commonmark = { version = "0.21", default-features = false, features = ["pulldown_cmark"] }

kaos = { path = "../../server/kaos" }
kimi-agent = { path = "../../server/kimi-agent" }
kosong = { path = "../../server/kosong" }
wire-client = { path = "../wire-client" }
